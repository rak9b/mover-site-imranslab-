<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- primary meta tags -->
    <title>WeMove Transport – Reliable Logistics & Cargo Solutions</title>
    <meta name="title" content="WeMove Transport – Reliable Logistics & Cargo Solutions" />
    <meta
      name="description"
      content="WeMove Transport provides professional logistics and cargo services with reliable freight solutions, modern transportation systems, and efficient supply chain management."
    />

    <!-- favicon -->
    <link rel="shortcut icon" href="./assets/images/favicon.svg" type="image/svg+xml" />

    <!-- google font link -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Rubik:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- tailwind custom configuration -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#f97316',
              secondary: '#0f2a44',
              accent: '#1e88e5',
              light: '#f4f7fa',
              dark: '#111827',
            },
            fontFamily: {
              heading: ['Oswald', 'sans-serif'],
              body: ['Rubik', 'sans-serif'],
            },
            screens: {
              '3xl': '1900px',
            },
          },
        },
      };
    </script>
  </head>

  <body class="font-body">
    <!-- Site Header -->
    <div id="header-root"></div>

    <!-- Hero Section -->
    <div id="hero-root"></div>

    <!-- About Section -->
    <div id="about-root"></div>

    <!-- Services Section -->
    <div id="service-root"></div>

    <!-- Features Section -->
    <div id="feature-root"></div>

    <!-- Projects Section -->
    <div id="project-root"></div>

    <!-- Blog Section -->
    <div id="blog-root"></div>

    <!-- Site Footer -->
    <div id="footer-root"></div>

    <!-- back to top -->
    <div id="backtop-root"></div>

    <!-- ionicon link -->
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

    <!-- main js link  -->
    <script type="module" src="./assets/js/app.js"></script>
  </body>
</html>
